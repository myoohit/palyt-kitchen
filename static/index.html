<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palyt Kitchen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-4">
    <h1>Palyt Kitchen</h1>
    <p class="text-muted">Stock on the left feeds the menu on the right.</p>

    <section id="stock-section" class="mt-4">
      <h2>Stock</h2>
      <table class="table table-bordered table-sm align-middle">
        <thead>
          <tr>
            <th>Ingredient</th>
            <th>Quantity</th>
            <th>Unit</th>
            <th>Par</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="stock-table-body">
          <!-- rows are inserted by app.js -->
        </tbody>
      </table>
    </section>
  </div>
      <section id="menu-section" class="mt-4">
      <h2>Menu</h2>
      <table class="table table-bordered table-sm align-middle">
        <thead>
          <tr>
            <th>Dish</th>
            <th>Price</th>
            <th>Availability</th>
          </tr>
        </thead>
        <tbody id="menu-table-body">
          <!-- rows are inserted by app.js -->
        </tbody>
      </table>
    </section>
  <script src="app.js"></script>
</body>
</html>

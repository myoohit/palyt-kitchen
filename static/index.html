<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palyt Kitchen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-4">
    <h1>Palyt Kitchen</h1>
    <p class="text-muted">Stock above feeds the menu below - editing stock updates availability live.</p>

    <section id="stock-section" class="mt-4">
      <h2>Stock</h2>
       <input type="text" id="stock-search" class="form-control form-control-sm mb-2" placeholder="Search ingredients...">

      <form id="add-ingredient-form" class="row g-2 mb-3">
        <div class="col-auto">
          <input type="text" id="new-name" class="form-control form-control-sm" placeholder="Name" required>
        </div>
        <div class="col-auto">
          <input type="number" step="any" min="0" id="new-qty" class="form-control form-control-sm" placeholder="Qty" required>
        </div>
        <div class="col-auto">
          <select id="new-unit" class="form-select form-select-sm">
            <option value="g">g</option>
            <option value="kg">kg</option>
            <option value="ml">ml</option>
            <option value="l">l</option>
          </select>
        </div>
        <div class="col-auto">
          <input type="number" step="any" min="0" id="new-par" class="form-control form-control-sm" placeholder="Par" required>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-sm btn-primary">Add ingredient</button>
        </div>
      </form>

      <table class="table table-bordered table-sm align-middle">
        <thead>
          <tr>
            <th>Ingredient</th>
            <th>Quantity</th>
            <th>Unit</th>
            <th>Par</th>
            <th>Status</th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="stock-table-body">
          <!-- rows are inserted by app.js -->
        </tbody>
      </table>
    </section>

    <section id="menu-section" class="mt-4">
      <h2>Menu</h2>
      <table class="table table-bordered table-sm align-middle">
        <thead>
          <tr>
            <th>Dish</th>
            <th>Price</th>
            <th>Availability</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="menu-table-body">
          <!-- rows are inserted by app.js -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
